version: '3.8'

services:
  oj-mysql:
    image: registry.cn-hangzhou.aliyuncs.com/library/mysql:8.0.19
    container_name: oj-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "1234"
      MYSQL_DATABASE: "oj"
      MYSQL_ROOT_HOST: "%"
      TZ: "Asia/Shanghai"
    ports:
      - "13306:3306"
    volumes:
      - oj-mysql-data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p1234"]
      interval: 10s
      timeout: 5s
      retries: 10

  oj-redis:
    image: registry.cn-hangzhou.aliyuncs.com/library/redis:latest
    container_name: oj-redis
    restart: always
    ports:
      - "16379:6379"
    volumes:
      - oj-redis-data:/data

  oj-judger:
    build:
      context: ./judger_source
      dockerfile: Dockerfile
    container_name: oj-judger
    restart: always
    ports:
      - "12345:5001"
    volumes:
      - ./data/judger_log:/log
      - ./data/ojdata:/ojdata:ro
    environment:
      SERVICE_PORT: "5001"
      PASSWORD: "iAMaPASSWORD"
    depends_on:
      oj-mysql:
        condition: service_healthy

volumes:
  oj-mysql-data:
  oj-redis-data:
