<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Update Contest</title>
    <meta charset="UTF-8">
    <th:block th:insert="~{fragment/header :: header}"></th:block>
    <style>
        .ui.fluid.container {
            max-width: 85% !important;
        }
    </style>
</head>
<body>
<div class="ui container" id="contest">
    <form class="ui form segment" v-on:submit.prevent>
        <div class="required field">
            <label>Title:</label>
            <input name="title" required type="text" v-model="content.title" maxlength="255"
                   :placeholder="'标题长度：' + content.title.length + '/255'">
            <div v-if="content.title.length > 255" class="ui red message">标题长度不能超过255个字符</div>
        </div>
        <div class="field">
            <label>Description:</label><input name="description" type="text" v-model="content.description">
        </div>
        <div class="field">
            <label>Privilege:</label>
            <select name="privilege" v-model="content.privilege">
                <option value="public">Public</option>
                <option value="private">Private</option>
            </select>
        </div>
        <div class="field">
            <label>Password:(Private 填写)</label>
            <input name="password" type="text" v-model="content.password" maxlength="200"
                   :placeholder="'密码长度：' + content.password.length + '/200'">
            <div v-if="content.password.length > 200" class="ui red message">密码长度不能超过200个字符</div>
        </div>
        <div class="required field">
            <label>开始时间Start Time(yyyy-MM-dd HH:mm):</label>
            <input name="startTime" placeholder="2020-02-20 02:02" required
                   type="text" v-model="content.startTime">
        </div>
        <div class="required field">
            长度Length(分钟minutes):
            <input name="lastTime" placeholder="300" required type="text" v-model="content.length">
        </div>
        <a @click="submit_form()" class="ui button green" id="submit-contest">提交Submit</a>
    </form>
</div>
<script type="text/javascript">
    var cid = location.pathname.split('/');
    cid = cid[cid.length - 1];
    var contest = new Vue({
        el: "#contest",
        data: {
            tid: cid,
            content: {
                title: "",
                description: "",
                privilege: "public",
                password: "",
                startTime: "",
                length: 300,
            }
        },
        methods: {
            form_validate() {
                if (!this.content.title || this.content.title.trim().length < 1) {
                    alert("标题不能为空");
                    return false;
                }
                if (this.content.title.length > 255) {
                    alert("标题长度不能超过255个字符");
                    return false;
                }
                if (this.content.password && this.content.password.length > 200) {
                    alert("密码长度不能超过200个字符");
                    return false;
                }
                if (this.content.startTime.search(/^\d{4}-\d{2}-\d{2} \d{2}:\d{2}$/) != 0) {
                    alert("日期格式错误，请使用格式：yyyy-MM-dd HH:mm");
                    return false;
                }
                return true;
            },
            submit_form() {
                if (!this.form_validate()) {
                    return false;
                }
                console.log(this.content);
                axios.post("/api/contest/background/" + this.tid, this.content)
                    .then(function (res) {
                        res = res.data;
                        if (res == "success") {
                            alert("更新成功！");
                            location.reload();
                        } else {
                            alert("更新失败：" + res);
                        }
                    })
                    .catch(function (error) {
                        if (error.response && error.response.data) {
                            var errorMsg = error.response.data.message || error.response.data;
                            alert("更新失败：" + errorMsg);
                        } else {
                            alert("网络错误，请稍后重试");
                        }
                    });
            }
        },
        created() {
            let that = this;
            axios.get("/api/contest/background/" + cid)
                .then(function (res) {
                    that.content = {
                        title: res.data.title,
                        tid: cid,
                        description: res.data.description,
                        privilege: res.data.privilege,
                        password: res.data.password,
                        startTime: res.data.normalStartTime,
                        length: res.data.length,
                    };
                }).catch(function (e) {
                console.log(e.response.status);
            })
        }
    })
</script>
</body>
</html>
