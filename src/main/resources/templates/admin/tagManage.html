<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta content="text/html;charset=UTF-8" http-equiv="Content-Type">
    <title>Tags</title>
    <th:block th:insert="~{fragment/header :: header}"></th:block>
</head>
<body>
<main class="ui container" id="tags">
    <div class="ui form">
        新增标签
        <div class="field">
            标签名<input type="text" name="name" required v-model="tagname" maxlength="200"
                        :placeholder="'标签名长度：' + tagname.length + '/200'">
            <div v-if="tagname.length > 200" class="ui red message">标签名长度不能超过200个字符</div>
            <div class="ui button" @click="add_tag()">Submit</div>
        </div>
    </div>
    <div class="ui segment">
        <div class="ui celled  list">
            <div class="item" v-for="t in tags">
                <div class="ui left floated header" v-html="t.name"></div>
            </div>
        </div>
    </div>
</main>
<script>
    var tags = new Vue({
            el: "#tags",
            data: {
                tags: [],
                tagname: ""
            },
            methods: {
                get_tags() {
                    let that = this;
                    axios.get("/api/admin/tag")
                        .then(function (res) {
                            if (res.data.code == 200) {
                                that.tags = res.data.data;
                            }
                        });
                },
                add_tag() {
                    let that = this;
                    var tagname = this.tagname.trim();
                    if (!tagname || tagname.length === 0) {
                        alert("标签名不能为空");
                        return;
                    }
                    if (tagname.length > 200) {
                        alert("标签名长度不能超过200个字符");
                        return;
                    }
                    axios.post("/api/admin/tag/add/", {
                        tagname: tagname
                    })
                        .then(function (res) {
                            if (res.data.code != 200) {
                                alert(res.data.message || "添加失败");
                            } else {
                                that.tagname = "";
                                that.get_tags();
                                alert("添加成功");
                            }
                        })
                        .catch(function (error) {
                            if (error.response && error.response.data) {
                                var errorMsg = error.response.data.message || error.response.data;
                                alert("添加失败：" + errorMsg);
                            } else {
                                alert("网络错误，请稍后重试");
                            }
                        });
                }
            },
            created() {
                this.get_tags();
            }
        })
    ;
</script>
</body>
</html>
